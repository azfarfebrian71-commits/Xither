<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLP PROJECT - WEB ORDER</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body { 
            background-color: #050b14; 
            color: #fff; 
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 20px 10px;
            position: relative;
            overflow-x: hidden;
        }

        /* VIDEO BACKGROUND FILE GARDEN MILIKMU */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.45) contrast(1.1);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(11,15,25,0.3) 0%, rgba(5,11,20,0.85) 100%);
            z-index: -1;
        }

        /* CONTAINER UTAMA DENGAN EFEK GLASSMORPHISM */
        .container { 
            max-width: 450px; 
            width: 100%; 
            background: rgba(15, 23, 42, 0.78); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 22px; 
            border-radius: 16px; 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2), 0 10px 30px rgba(0,0,0,0.8); 
            animation: fadeIn 0.6s ease-in-out;
        }

        .hidden { display: none !important; }

        /* ANIMASI PAGE TRANSITION */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animated-page {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* BANNER & HEADER */
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { 
            color: #38bdf8; 
            font-size: 24px; 
            font-weight: 900; 
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

            background: rgba(30, 41, 59, 0.7); 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 15px;
